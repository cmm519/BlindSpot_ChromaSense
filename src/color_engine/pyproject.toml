[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "color_engine"
version = "0.1.0"
requires-python = ">=3.11"
# rapidocr-onnxruntime is also required. The Dockerfile installs it with --no-deps.
dependencies = [
    "numpy",
    "Pillow",
    "pillow-heif",
    "scikit-image",
    "scikit-learn",
    "opencv-python-headless",
    "onnxruntime",
    "pyclipper",
    "pyyaml",
    "shapely",
    "six",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "daltonlens"]

[tool.setuptools.packages.find]
include = ["color_engine*"]

[tool.setuptools.package-data]
color_engine = ["data/*"]

[tool.ruff]
extend = "../portal/pyproject.toml"

[tool.coverage.run]
source_pkgs = ["color_engine"]
