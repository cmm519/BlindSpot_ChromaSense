services:
  portal:
    build:
      context: .
      target: runtime
    command: ["python", "-m", "chromasense.main"]
    ports:
      - "9090:9090"
    env_file:
      - path: .env
        required: false
    environment:
      CHROMASENSE_DATA_DIR: /data
    volumes:
      - chromasense-data:/data
    cpus: 4
    mem_limit: 8g

  dev:
    build:
      context: .
      target: dev
    working_dir: /workspace
    env_file:
      - path: .env
        required: false
    environment:
      CHROMASENSE_DATA_DIR: /data
    volumes:
      - .:/workspace
      - chromasense-data:/data
    cpus: 4
    mem_limit: 8g

volumes:
  chromasense-data:
